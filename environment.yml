# Conda environment for CC-GenClaw.
#
# Create & activate:
#   conda env create -f environment.yml
#   conda activate cc-genclaw
#
# Then install the headless browser used by the code-draft renderers:
#   playwright install chromium
#   # On Linux you may also need: playwright install-deps
#
# Finally copy config.example.yaml -> config.yaml and fill in your API keys.
name: cc-genclaw
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - openai>=1.0.0
      - pydantic>=2.0.0
      - pyyaml>=6.0
      - python-dotenv>=1.0.0
      - requests>=2.31.0
      - pillow>=10.0.0
      - numpy>=1.24.0
      - playwright>=1.40.0
      - chainlit>=1.0.0
      # install the project itself (editable)
      - -e .
